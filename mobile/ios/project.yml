# XcodeGen spec: `make project` (or `xcodegen generate`) writes GoLinkDesk.xcodeproj,
# which is not committed. Signing comes from Config/Local.xcconfig (gitignored)
# or from the environment (see the Makefile).
name: GoLinkDesk
options:
  bundleIdPrefix: org.go-link
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  DeskCore:
    path: DeskCore
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
targets:
  GoLinkDesk:
    type: application
    platform: iOS
    sources:
      - path: DeskViewer
    dependencies:
      - package: DeskCore
      - package: WebRTC
    info:
      path: DeskViewer/Info.plist
      properties:
        CFBundleDisplayName: go-link Desk
        CFBundleName: go-link Desk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # An iPad's trackpad and mouse arrive as pointer events (hover, buttons, scrolling).
        UIApplicationSupportsIndirectInputEvents: true
        # The computer's sound keeps playing with the screen locked for a moment.
        UIBackgroundModes: [audio]
        # ProMotion: the picture may be shown at up to 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # libwebrtc can open the camera and the microphone (for calls), so
        # Apple asks for these; this app never turns them on.
        NSCameraUsageDescription: go-link Desk does not use the camera. The WebRTC library it includes could, for video calls, which this version does not have.
        NSMicrophoneUsageDescription: go-link Desk does not use the microphone. The WebRTC library it includes could, for calls, which this version does not have.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.go-link.desk.ios
        PRODUCT_NAME: GoLinkDesk
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  GoLinkDesk:
    build:
      targets:
        GoLinkDesk: all
    run:
      config: Debug
    archive:
      config: Release
